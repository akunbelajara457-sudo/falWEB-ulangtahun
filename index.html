<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 Selamat Ulang Tahun! 🎉</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px }
        .container{ width:100%; max-width:600px }
        .page{ display:none; animation:fadeIn .8s ease-in }
        .page.active{ display:block }
        @keyframes fadeIn{ from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }

        .form-container{ background:white; padding:50px 40px; border-radius:25px; box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:center }
        .form-container h1{ color:#667eea; margin-bottom:10px; font-size:2.4em; text-shadow:2px 2px 4px rgba(0,0,0,.1); }
        .subtitle{ color:#666; margin-bottom:20px; font-size:1.05em }
        .form-group{ margin-bottom:18px; text-align:left }
        .form-group label{ display:block; margin-bottom:8px; color:#333; font-weight:600 }
        input{ width:100%; padding:12px 14px; border:2px solid #e6e6e6; border-radius:10px }
        .form-row{ display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:12px; margin-bottom:18px }
        .btn-submit{ width:100%; padding:14px; background:linear-gradient(135deg,#667eea,#764ba2); color:white; border:none; border-radius:12px; font-weight:700; cursor:pointer }

        .cake-container{ background:white; padding:30px; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); text-align:center }
        .cake-3d{ margin:20px 0; perspective:900px; height:300px; display:flex; align-items:center; justify-content:center }
        .cake{ position:relative; width:200px; height:200px; transform-style:preserve-3d; animation:float 3s ease-in-out infinite }
        @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
        .cake-layer{ position:absolute; width:200px; height:60px; border-radius:14px; left:0; right:0; margin:0 auto }
        .layer1{ bottom:0; background:linear-gradient(145deg,#8b4513,#654321) }
        .layer2{ bottom:56px; width:170px; left:15px; background:linear-gradient(145deg,#cd853f,#996515) }
        .layer3{ bottom:108px; width:140px; left:30px; background:linear-gradient(145deg,#daa520,#b8860b) }
        .candles{ position:absolute; top:80px; left:50%; transform:translateX(-50%); display:flex; gap:18px }
        .flame{ width:8px; height:16px; background:linear-gradient(180deg,#ff6b00,#ffd700); border-radius:50% }

        .greeting{ color:#764ba2; font-size:1.7em; margin:14px 0; font-weight:700 }
        .greeting-date{ color:#667eea; margin-bottom:12px }

        .letter{ background:linear-gradient(135deg,#fff8e7,#ffe4b5); padding:20px; border-radius:12px; border:2px solid #d4a574 }
        .letter-header{ text-align:center; margin-bottom:10px }
        .heart{ font-size:1.6em }
        .letter-content{ color:#333; margin-bottom:12px }
        .btn-open-letter{ padding:10px 18px; border-radius:12px; border:none; background:linear-gradient(135deg,#667eea,#764ba2); color:white; cursor:pointer }

        .modal{ display:none; position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center }
        .modal.show{ display:flex }
        .modal-content{ background:linear-gradient(135deg,#fff8e7,#ffe4b5); padding:24px; border-radius:12px; max-width:520px; text-align:center }
        .close-btn{ position:absolute; right:14px; top:14px; background:#ffcdd2; border-radius:50%; width:36px; height:36px; border:none }
        .letter-message{ white-space:pre-line; text-align:left; color:#222 }

        @media (max-width:600px){ .form-row{ grid-template-columns:1fr } .greeting{ font-size:1.4em } }
    </style>
</head>
<body>
    <div class="container">
        <div id="formPage" class="page active">
            <div class="form-container">
                <h1>🎉 Selamat Ulang Tahun! 🎉</h1>
                <p class="subtitle">Isi data, lalu buka surat cinta & doa spesial.</p>

                <form id="birthdayForm" onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label for="nama">Nama penerima</label>
                        <input id="nama" type="text" placeholder="Contoh: Sayang" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group"><label for="hari">Hari</label><input id="hari" type="number" min="1" max="31" placeholder="01" required></div>
                        <div class="form-group"><label for="bulan">Bulan</label><input id="bulan" type="number" min="1" max="12" placeholder="01" required></div>
                        <div class="form-group"><label for="tahun">Tahun</label><input id="tahun" type="number" min="1900" max="2099" placeholder="2000" required></div>
                    </div>

                    <button type="submit" class="btn-submit">🎁 Buka Kejutan!</button>
                </form>
            </div>
        </div>

        <div id="cakePage" class="page">
            <div class="cake-container">
                <div class="cake-3d">
                    <div class="cake">
                        <div class="cake-layer layer1"></div>
                        <div class="cake-layer layer2"></div>
                        <div class="cake-layer layer3"></div>
                        <div class="candles"><div class="flame"></div><div class="flame"></div><div class="flame"></div></div>
                    </div>
                </div>

                <h2 id="greeting" class="greeting"></h2>
                <div id="greetingDate" class="greeting-date"></div>

                <div class="letter">
                    <div class="letter-header"><span class="heart">💌</span><h3>Surat Cinta & Doa</h3></div>
                    <div class="letter-content">Di sini akan muncul surat cinta dan doa spesial untuk penerima. Tekan tombol untuk membukanya.</div>
                    <button class="btn-open-letter" onclick="openLetterModal()">💝 Buka Surat</button>
                </div>

                <button class="btn-back" onclick="backToForm()" style="margin-top:12px">← Kembali</button>
            </div>
        </div>
    </div>

    <div id="letterModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <button class="close-btn" onclick="closeLetterModal()">×</button>
            <div class="letter-header"><span class="heart">💌</span><h3>Untukmu</h3></div>
            <div id="letterMessage" class="letter-message"></div>
            <div style="margin-top:12px; font-weight:600; color:#444">✨ Semoga harimu diberkati ✨</div>
        </div>
    </div>

    <script>
        let userData = { nama:'', tanggal:'' };

        function handleSubmit(e){
            e.preventDefault();
            const nama = document.getElementById('nama').value.trim();
            const hari = document.getElementById('hari').value.padStart(2,'0');
            const bulan = document.getElementById('bulan').value.padStart(2,'0');
            const tahun = document.getElementById('tahun').value;
            if(!nama || !hari || !bulan || !tahun){ alert('Isi semua data dulu'); return }
            userData.nama = nama; userData.tanggal = `${hari}/${bulan}/${tahun}`;
            showCakePage();
        }

        function showCakePage(){
            document.getElementById('formPage').classList.remove('active');
            document.getElementById('cakePage').classList.add('active');
            const bulanNames=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            const [h,b,t] = userData.tanggal.split('/');
            document.getElementById('greeting').textContent = `Selamat Ulang Tahun, ${userData.nama}!`;
            document.getElementById('greetingDate').textContent = `${h} ${bulanNames[parseInt(b)] || ''} ${t}`;
            createConfetti();
        }

        function openLetterModal(){
            // Pesan tetap: surat cinta + doa (personalized dengan nama)
            const pesan = `Kekasihku ${userData.nama},\n\nSelamat ulang tahun. Di hari istimewa ini aku mengirimkan seluruh cinta dan doa yang tulus untukmu. Semoga Tuhan selalu melimpahkan kesehatan, kebahagiaan, dan rezeki. Semoga setiap langkahmu diberkati dan impian-impianmu cepat terwujud.\n\nAku mencintaimu lebih dari kata-kata, dan selalu mendoakan yang terbaik untukmu. Amin.`;
            document.getElementById('letterMessage').textContent = pesan;
            const modal = document.getElementById('letterModal');
            modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
            createConfetti();
        }

        function closeLetterModal(){ const modal=document.getElementById('letterModal'); modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); }

        function backToForm(){ document.getElementById('cakePage').classList.remove('active'); document.getElementById('formPage').classList.add('active'); document.getElementById('birthdayForm').reset(); userData={nama:'', tanggal:''}; }

        window.addEventListener('click', (e)=>{ const modal=document.getElementById('letterModal'); if(e.target===modal) closeLetterModal(); });

        function createConfetti(){ const pieces=50; const colors=['#FF6B6B','#4ECDC4','#45B7D1','#FFA07A','#98D8C8','#F7DC6F']; for(let i=0;i<pieces;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left = Math.random()*100 + '%'; c.style.top='-10px'; c.style.width=(6+Math.random()*10)+'px'; c.style.height=(6+Math.random()*10)+'px'; c.style.background = colors[Math.floor(Math.random()*colors.length)]; c.style.borderRadius='50%'; c.style.zIndex='999'; const delay=Math.random()*0.5; c.style.animationDelay = delay + 's'; document.body.appendChild(c); setTimeout(()=>c.remove(), 3500 + delay*1000); } }
    </script>
</body>
</html>
